    <script>window.__KINY_PROJECT__ = {"manifest":"{\"name\":\"WDApple\",\"version\":\"1.0.0\",\"engine\":\"0.11.0\",\"entry\":\"main.kin\",\"id\":\"7eac67a645814588a49a351e8b952809\"}","files":{"main.kin":"~ let knock = false\n~ let check_goats_label = false\n~ let label = 0\n~ let goats_red_apple = 0\n~ let being_beast = 0   \n~ let desire_to_eat = 0\n~ let clue = 0\n~ let shirt = false\n~ let day2nocan = 0\n~ let lionchocker = 0\n~ let day2givethecan = 0\n~ let knife = 0\n~ let xianyi = 0\n~ let heknowsthemirror =  0\n~ let goatsshirt = 0\n~ let truth = 0\n~ let notebook = 0\n~ let heavy = 0\n~ let mirrorbroke =0\n~ const idnum = \"2017060520302\"\n~ let cishu = 0\n~ let inputnum = 0\n~ let inputsuoding = 0\n~ const suoding = \"19881020\"\n~ let suodingcishu = 0\n~ let caidan = 0\n~ const caidankey = \"20240828\"\n~ let lastin = 0\n@text_speed(20) \n@panel(\"bottom\", \"已收集{clue}条线索\")\n@img(\"assets/fengmian.jpg\")\n-\u003e开始\n===开始===\n+[开始游戏]-\u003e第一天_醒来\n+[神秘彩蛋]-\u003e提示\n+[游戏后记]-\u003e后记\n===提示===\n@input(caidan, \"mymymy的具体年月日（8个数字）\")\n@if{caidan === caidankey}\n\u003e\u003ccolor=lightgray\u003e\u003csize=1.5\u003e这里是【档案室】。\u003c/color\u003e\n\u003e\u003ccolor=lightgray\u003e\u003csize=1.5\u003e我将它们放在这里，希望能够帮助你收集到【结局3】、【结局4】和【结局5】。\u003c/color\u003e\n\u003e@img(\"assets/fzdid.jpg\")\n\u003e@img(\"assets/mlid.jpg\")\n\u003e+[回到初始界面]\n\u003e\u003e@clear()\n\u003e\u003e-\u003e开始\n@else\n\u003e\u003ccolor=lightgray\u003e或许你应该直接开始游戏！\u003c/color\u003e\n\u003e+[回到初始界面]\n\u003e\u003e@clear()\n\u003e\u003e-\u003e开始\n===后记===\n非常感谢您的参与！作品还有许多不足之处，万望海涵。\n如果您有任何想对我说的话，这里是提问箱⬇️。\n恳切期待！非常期待！真的很期待！\nhttps:\\//www.xingququan.com/23ff0880ce\n+[回到初始界面]\n\u003e@clear()\n\u003e-\u003e开始\n=== 第一天_醒来 ===\n@img(\"assets/fengmian.jpg\")\n@bgm_play(\"assets/beyond the frozen signal.mp3\")\n\u003csize=1.5\u003e\u003ccolor=ghostwhite\u003e/  “部分人群因心理问题而难以进入正常亲密关系。并且，由于精神状态长期处于混乱状态，该群体在某些方面会表现出过度强烈的欲望，例如极端的\u003ccolor=aqua\u003e性欲\u003c/color\u003e、\u003ccolor=aqua\u003e食欲\u003c/color\u003e等。并且，该群体的睡眠质量远低于正常值，但做梦频次和时长均远高于正常值，且在梦中延续并放大了患者在现实中表现出的极端倾向。经研究，该群体的梦境普遍存在血腥暴力等因素，\u003ccolor=aqua\u003e在特殊情况下甚至会影响他人脑电波，导致‘异床同梦’现象出现\u003c/color\u003e。被动入梦者与患者梦境中的非玩家角色（NPC）有微小区别，例如瞳孔、衣着等，且在隐蔽处有特殊标记。\u003cbr\u003e另外，请小心你的\u003ccolor=royalblue\u003e影子\u003c/color\u003e。”  /\u003c/size\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\n你醒了过来。\n周围很昏暗，空气里有潮湿的霉味，湿黏如苔藓。除了平躺时间太长导致的腰酸和无法忽视的饥饿感之外，身上并没有其他的不适。\n你环顾四周，房间陈设十分简单，只有床、床对面的一台电视、墙上显示日期和时间的电子表，以及一个小卫生间。\n-\u003e检查房间\n===检查房间===\n{ once(\"逐一检查房间内的陈设吧。\") }\n* [检查床铺]\n\u003e床头有一个遥控器，你把它拿了起来。\n\u003e-\u003e检查房间\n* [检查电视]\n\u003e电视……可能需要用【遥控器】操作。\n\u003e-\u003e检查房间\n* [检查时间和日期]\n\u003e今天是\u003cb\u003e10月17日\u003c/b\u003e，时间为18点整。你注意到旁边有一个闪着红点的\u003cb\u003e摄像头\u003c/b\u003e。\n\u003e-\u003e检查房间\n房间里没有其他东西了。去查看一下卫生间吧。\n【卫生间】\n*[检查卫生间]\n  卫生间很干净，洗手池上方有一面镜子。你敲了敲镜子，\u003cb\u003e镜子背后似乎是空的\u003c/b\u003e。\u003cb\u003e并且你意识到，卫生间里没有摄像头。\u003c/b\u003e\n  要洗个手吗？\n* [洗手]\n  \u003e你拧开水龙头。温度过低的水流划过你的皮肤，你条件反射地缩回手，\u003c\u003e\n* [不洗]\n  \u003e没有洗手的义务！\u003cbr\u003e你仔细观察着卫生间，不放过任何一个角落，却在抬头时\u003c\u003e\n猝不及防地与镜子中的生物对视。\n那里面站着一头……不，一个，长着北极熊头颅的，穿着衣服的，熊头人身的怪物。熊的眼睛是\u003ccolor=royalblue\u003e\u003cb\u003e\u003csize=1.2\u003e蓝色\u003c/color\u003e的。\n* [？！]\n  你为了确定这到底是不是自己的幻觉便伸手擦拭了一下镜子，但镜子里依然是一个怪异的物种。\n  巨大的震撼让你的手几乎有些发抖，险些捏不住自己衣服的扣子。你低头解开衣领，发现自己的身体还是正常的人类身体没错，但你抬手摸脸的时候，脸上的触感是毛茸茸的。你再三确定，你现在是一头有着熊头的人类。\n  \u003cpause\u003e不是幻觉，你现在就是一个\u003cb\u003e长着熊头的人类\u003c/b\u003e……你花了些时间才接受了这个事实。\n我得回去。\n我得回去……\n我得回去！\n*[离开卫生间]\n【回到房间】\n-\u003e规则\n===规则===\n*[尝试开门]\n你的手放在房门把手上狠狠一拧，门锁纹丝不动。\n*[再次尝试]\n还是不行……或许能从电视里找到一些线索？\n*[打开电视]\n你拿起遥控器，试着按下开机键。电视屏幕亮起，一行字缓缓浮现：\n\u003cb\u003e\u003cfont=黑体\u003e\u003csize=1.5\u003e欢迎您，幸运的玩家。\u003c/b\u003e\n……？\n\u003cpause\u003e\u003cb\u003e\u003cfont=黑体\u003e\u003csize=1.5\u003e本次游戏共计12人，包括3名狼人、1名猎人、1名守卫、1名预言家、1名丘比特以及4名平民。\u003c/b\u003e\n这又是什么意思？\n\u003cpause\u003e你一头雾水，屏幕继续滚动：\n“接下来将播放游戏规则，请务必谨记，并在接下来的游戏中遵从规则行事。\n@divider(\"游戏规则\")\n\u003cfont=黑体\u003e\u003csize=1.2\u003e规则一，\u003cb\u003e禁止\u003c/b\u003e离开限定区域，\u003cb\u003e禁止\u003c/b\u003e破坏道具；\u003cbr\u003e规则二，\u003cb\u003e禁止\u003c/b\u003e在规则允许时间之外伤害其他玩家；\u003cbr\u003e规则三，除狼人以外，其余玩家在22:00至次日早6:00只能在自己房间内活动；\u003cbr\u003e规则四，每晚19:00至20:00，所有玩家需要在大厅内投票，\u003cb\u003e得票最高者出局\u003c/b\u003e；\u003cbr\u003e若时间截止前未能完成投票或出现平票，\u003cb\u003e则所有玩家出局\u003c/b\u003e；\u003cbr\u003e规则五，违反以上规则者将会受到\u003cb\u003e\u003ccolor=red\u003e惩罚\u003c/b\u003e。\u003c/font\u003e\n\u003cpause\u003e\u003cfont=黑体\u003e\u003csize=1.2\u003e在场玩家共12名，包括狼人3名，平民5名，四种神职各1名；四种神职包括：预言家、守卫、猎人和丘比特。\u003cbr\u003e\u003cbr\u003e【狼人】每晚选择并\u003cb\u003e杀死\u003c/b\u003e一名玩家；\u003cbr\u003e【预言家】每晚可选择一名玩家，\u003cb\u003e获知其身份信息\u003c/b\u003e：若所选玩家为神职或村民，则预言家得知该玩家为村民；若所选玩家为狼人，则预言家得知其为狼人；\u003cbr\u003e【守卫】每晚可选择一名玩家，若当晚该玩家同时被狼人和守卫选择，则会受到保护，\u003cb\u003e在今晚免于出局\u003c/b\u003e；守卫不可连续两天守护同一人；\u003cbr\u003e【猎人】猎人出局后，将会\u003cb\u003e开枪\u003c/b\u003e，带走所选玩家；\u003cbr\u003e【丘比特】游戏开始第一天时，可指定两人成为情侣；\u003cb\u003e被选中的情侣在一方出局后，另一方将一同出局\u003c/b\u003e。\u003cbr\u003e\u003c/font\u003e\n\u003cpause\u003e\u003cfont=黑体\u003e\u003csize=1.2\u003e\u003cbr\u003e当狼人数量\u003cb\u003e大于或等于\u003c/b\u003e其余角色数量时，狼人阵营胜利；\u003cbr\u003e当狼人\u003cb\u003e全部死亡时\u003c/b\u003e，村民阵营（包括村民和神职）胜利；\u003cbr\u003e当以上任意一方达成胜利条件时，\u003cb\u003e情侣依旧存活\u003c/b\u003e，第三方阵营（包括丘比特和情侣）胜利；\u003cbr\u003e其中，丘比特只能跟随第三方阵营胜利。\u003cbr\u003e游戏胜利者可以安全离开限定区域，其余玩家死亡；\u003cbr\u003e违反角色行动规则者，将视为放弃游戏。\u003cbr\u003e\u003cb\u003e\u003csize=1.5\u003e——————————————————\u003c/b\u003e\u003c/font\u003e\n\u003cpause\u003e这电视怎么自顾自地就开始说一些人类无法理解的语言？\n\u003cfont=黑体\u003e\u003csize=1.2\u003e\u003cbr\u003e您的身份是：\u003cb\u003e\u003ccolor=royalblue\u003e\u003csize=1.5\u003e猎人\u003c/b\u003e。\u003cbr\u003e请按照指示拆除遥控器背板，获得您的身份道具。\u003c/font\u003e\n你打开遥控器，在里面找到了一枚子弹。\n@img( \"assets/bullet.jpg\")\n你把子弹放进口袋，就在你疑惑怎么用一颗子弹开枪的时候，电视发出刺耳的电流滋啦声，并弹出醒目红字：\n\u003cfont=黑体\u003e\u003ccolor=red\u003e\u003csize=1.5\u003e\u003cb\u003e请选择本次猎物！\u003c/color\u003e\u003cbr\u003e\u003csize=1\u003e\u003c/font\u003e\n阅读这些文字并理解实在是耗费了你一大批脑细胞。\n现在应该怎么做？\n*【我鸟都不鸟】\n\u003e你拿起遥控器打算关掉电视，好出去找点东西填饱肚子。但你对着电视随便按了几下，屏幕丝毫不受影响，还在重复：\u003cbr\u003e\u003cbr\u003e\u003cfont=黑体\u003e\u003ccolor=red\u003e\u003csize=1.5\u003e\u003cb\u003e请选择本次猎物！\u003c/color\u003e\u003cbr\u003e\u003csize=1\u003e\u003c/font\u003e\n*【尝试其他按键】\n\u003e你对着电视随便按了几下，屏幕丝毫不受影响，还在重复那句话：\u003cbr\u003e\u003cbr\u003e\u003cfont=黑体\u003e\u003ccolor=red\u003e\u003csize=1.5\u003e\u003cb\u003e请选择本次猎物！\u003c/color\u003e\u003cbr\u003e\u003csize=1\u003e\u003c/font\u003e\n你深吸一口气，在第一次人械危机中败下阵来……现在怎么办？\n*【直接关机】\n\u003e电视毫无反应。\u003cbr\u003e你懒得再理会这莫名其妙的电视，打算去试试用其他方法破门。\n*【尝试破门】\n\u003e你懒得再理会这莫名其妙的电视，打算去试试用其他方法破门。\n就在你手握住门把的瞬间，你突然感觉呼吸一滞，身体不受控制地向前倒去，头猛地撞上了门板。\n一瞬间，你的大脑完全陷入空白，眼球不受控制地上翻，眼前不断迸出电路断触时的闪屏画面，四肢无规律抽搐，手指拼命抓挠了几次才勉强抠住深深陷入脖颈的项圈。\n\u003cpause\u003e你耳边只剩下一个声音：\n\u003cbr\u003e\u003cfont=黑体\u003e\u003ccolor=red\u003e\u003csize=1.5\u003e\u003cb\u003e请选择本次猎物！\u003c/color\u003e\u003cbr\u003e\u003csize=1\u003e\u003c/font\u003e\u003cbr\u003e\n长时间的缺氧已经让你丧失了正常思考的能力，你只能徒劳地从喉咙里挤出几个无意义的音节，口鼻喷血，目之所及一片鲜红。\n难道就要这么死在这里吗？不行，我得做点什么……！！！\n*\u003ccolor=red\u003e抓住遥控器\u003c/color\u003e\n\u003e你手指已经抖得几乎抓不住遥控器，只好用尽最后一丝力气握紧拳头拼命砸向按键，也来不及管屏幕上显示的是什么；终于，电视发出一声尖锐短促的电子音：\n*\u003ccolor=red\u003e抓住项圈\u003c/color\u003e\n\u003e直到窗外最后一丝阳光熄灭，你也没能挣脱项圈。半梦半醒间，你听到了门锁被转动的声音。\n\u003e\u003cb\u003e你再也没能离开这里。\u003c/b\u003e\n\u003e【结局1】窒息\n\u003e-\u003eEND\n\u003cbr\u003e\u003cfont=黑体\u003e\u003csize=1.5\u003e已选择\u003ccolor=red\u003e山羊\u003c/color\u003e作为本次猎物。祝您一切顺利！\u003cbr\u003e\u003csize=1\u003e\u003c/font\u003e\u003cbr\u003e\n\u003cpause\u003e颈环应声松开。\n你狼狈地瘫倒在地，眼前一片花白，鼻腔里满是血腥味，并伴随着阵阵耳鸣。\n出去，我得出去……\n你撑着爬起来，靠在墙壁上狼狈地平复呼吸。\n你听到锁舌弹开，撑身站起后转动门把，终于得以离开这个诡异的房间。\n-\u003e第一天_和山羊见面\n===第一天_和山羊见面===\n*【走廊】\n你放慢脚步观察着周围，房间外边比之房间内部的诡异感有过之而无不及。你经过几扇半掩着的、沉默的房门，没什么动静，房间里的人大概都已经离开了。\n全都是一样的房间，很像是集体宿舍。你又仔细看了看，房门规格相同，也没有标门牌号，只能通过房门上张贴的\u003cb\u003e动物图片\u003c/b\u003e来区分。\n你在走廊上捡到一张印着许多动物头像的图片。\n*[捡起]\n@img( \"assets/day1_all.jpg\")\n你房门上贴了一张北极熊的照片，和你在镜子里看到的熊头一样。\n\u003cpause\u003e在你探查的过程中，随着嗅觉的恢复，那股无法忽视的\u003cb\u003e消毒水味\u003c/b\u003e逐渐开始占据你的鼻腔。\n你揉揉鼻子咳了两声，停在了最后一扇房门前——这扇门紧闭着，门上贴着一张羊的照片。\n*[凑近]\n@img( \"assets/goat.jpg\")\n你不能确定这张照片和你刚才选择的“猎物”之间是否有联系。\n要敲门吗？\n-\u003e敲门\n===敲门===\n*【敲门】\n\u003e~knock = true\n\u003e或许是出于对山羊的愧疚，又或许是这个紧闭房门的房间的好奇，促使你伸出手在门板上敲了敲。周遭太静了，叩门声在心理作用下被无限放大，你甚至感觉胸腔都被震得发麻。-\u003e山羊\n*【不敲】\n\u003e你在门口犹豫一番，还是离开了。\n\u003e现在要去哪里呢……\n-\u003e第一天警报\n===山羊===\n不知过了多久，门内传来几声急促的呛咳，紧接着是一串略显慌乱的脚步声，而后房门被从里面拉开了。你走上前去刚想说什么，却被眼前的景象慑得愣在原地：\u003cbr\u003e\u003cpause\u003e给你开门的是一个人——或者说，长着\u003cb\u003e山羊头颅\u003c/b\u003e的“人”！\n那对巨大的角仿佛骨质翅一般打着卷展开，\u003ccolor=red\u003e虹膜是金黄色的\u003c/color\u003e，幽深的黑色瞳孔横亘着劈开眼球；但脖子以下则是正常的人类身体，没有多余的毛发、蹄子或尾巴结构。他脖颈后面似乎有些白色卷毛，深入到衣领下面……其余的你看不到了。\n你仿佛被什么定住了一般动弹不得，几乎是用尽所有力气张张嘴，却半个字都没能说出来。\n山羊人似乎也很意外，犹豫一阵后主动开口：“怎么了？”\n*[……]\n\u003e此刻你就是再有事也不敢对着一个口吐人言的山羊说，只讷讷点头。\n\u003e山羊有些困惑地歪头，你刚平复下心情，肚子却先一步叫了起来。\n*[\"看到你这里门还关着，想问你是不是需要帮忙。\"]\n\u003e你话还没说完，肚子却先一步叫了起来。\n山羊的表情一瞬间有些错愕，摸了摸口袋之后，居然掏出一个苹果：“我只有这个，你拿去吃。”\n你把视线从山羊投币机入口一般的矩形瞳孔上挪开，尴尬地扯扯嘴角，终于找回了自己的声音：“实在不好意思，我是看你的门还关着，想问你需不需要帮忙。谢谢，你留着自己……”\n-\u003e第一天警报\n===第一天警报===\n\u003cpause\u003e尖锐的警报蜂鸣声响彻整个空间，彻底打乱了你的思绪。\n“\u003csize=1.2\u003e\u003cb\u003e请所有玩家现在到一楼大厅集合，进行投票。\u003c/b\u003e\u003c/size\u003e”\n*{knock}“走吧。”[]你对山羊说。在广播声中，山羊还是把苹果放到了你口袋里。\n\u003e~goats_red_apple++\n-\u003e第一天大厅\n*-\u003e第一天大厅\n===第一天大厅===\n【大厅】\n和你想象的一样，大厅里聚集着其他像山羊一样的兽头人，每个物种和你在房间里看到的选项一一对应。一共9个，再加上你和山羊……\u003cbr\u003e为什么只有11个人？\u003cbr\u003e你感觉自己后心的衣服已经汗津津地贴在了皮肤上，略用余光扫过这些人，你发现他们无一例外都是\u003cb\u003e蓝色的眼睛\u003c/b\u003e。\n\u003cpause\u003e不远处的鸟头人说话了：“人齐了吧？谁知道这到底什么地方啊？”\n旁边的豪猪人接话：“这破地方太吓人了，真待不下去。”\n正在研究大门的斑马人开口：“这门没锁啊，”他拽了两下门把手，“是不是能从这里出去？”\n豪猪人探头往外看了看：“这能出去吗？倒是有路。”\n斑马指了指不远处：“外面走一段就到公路上了。我估计这里大概是个郊区，出去之后试着拦个车也行吧？”\n\u003cpause\u003e豪猪四下观察了一番，试探着把脚迈出去，一旁的斑马赶紧拉住他：“等一下，电视不是说‘禁止离开限定区域’吗？还是别出去了吧……”\n所有人都看向豪猪。但……豪猪的脸和人类的脸差得实在太多，你实在无法判断他的表情表达了什么情绪。\n豪猪：“先试试，我感觉没什么。”\n斑马也不好再劝，握住他胳膊的手犹豫了一下，还是松开了。\n豪猪一开始还只是把脚探出去，过了一阵又慢慢探出半个身子，想象中生化危机里的切割激光并没有出现，豪猪安然无恙，因此他兴奋得刺都蓬松均匀炸开了：“没事！”\n\u003cpause\u003e你松了口气。\n豪猪迈出大门，一旁的斑马也跟着伸了半个脚出去；就在斑马即将半个身子越出门外的时候，突然伸手摸了摸脸：“下雨了吗？怎么有水——”\n\u003cpause\u003e声音戛然而止。\n你们所有人都看到了，那不是水，而是从豪猪喉咙处喷出的血！\n斑马连滚带爬地摔回门内，衣服上斑斑点点全是血迹，语无伦 cpause\u003e刚才老虎和狮子的话都不无道理，你不想死。\n其余人已经做出了选择。\n秒针还在继续转动；哒，哒。\n\u003cpause\u003e现在怎么办？大部分人肯定会投老虎的。\n第一天没有公投目标，如果贸然指认其他人，明天必然会背上重大嫌疑……你虽然不满狮子的行为，但他说的话无疑是为其他人指了一条绝对安全的路。\n是弃票还是投给老虎？你冷汗涔涔，不由得捏紧了衣角。\n*[【老虎】]\n\u003e投票结果出来了。\n\u003e狮子、斑马、鹿、鸟、犀牛、狐狸和你投给了老虎，\u003cb\u003e共计8票\u003c/b\u003e；兔子、山羊和老虎弃票。\n\u003e~being_beast++\n*[【弃票】]\n\u003e投票结果出来了。\n\u003e狮子、斑马、鹿、鸟、犀牛和狐狸投给了老虎，\u003cb\u003e共计6票\u003c/b\u003e；你、兔子、山羊和老虎弃票。\n“\u003cb\u003e正在收录投票结果，请耐心等待。\u003c/b\u003e”\n老虎在看到结果的那一刻就没再说什么，静默片刻后嗤笑一声，在看到狮子之后更是发自内心地笑了出来。\n狮子后退半步：“你，你笑什么？”\n\u003cpause\u003e“笑什么？”老虎一把钳住他的脖颈，“我都要死了，你管我笑什么？”\n“你、你别忘了，”狮子被老虎掐的有些呼吸不畅，只断断续续喘气，“伤害他人、也是、也……”\n“也？你不会是想说‘\u003cb\u003e也会被惩罚\u003c/b\u003e’吧？！”老虎的表情瞬间变得狰狞起来，“我都要死了，还管什么规则？！你觉得我还会怕？！”\n话音刚落，老虎一拳捶在了狮子胸口，直打得后者胸骨如玻璃落地般啪嚓一声脆响，撑不住后退两步，又被追上来兜头盖脸地连扇了几巴掌，直直摔到墙上。狮子身板又干又薄，身量虽高却没几个力气，因此几乎是单方面被老虎痛殴，毫无还手之力，只瘫在那里一味惨叫。\n\u003cpause\u003e老虎似乎是打烦了，像扔块抹布似的把狮子撇到一旁，又用沾满血迹的拳头擦了擦嘴，回头看了看时间。\n在场的所有人都只是盯着他看。\n老虎撑着墙壁慢慢走了两步，手掌和鞋底分别在墙和地板上留下两道血色的印痕，直到他最后脚下一软倒在墙边，又因为痛楚而慢慢蜷成一团。\n在狮子的惨叫声中和众人的注视下，他逐渐没了呼吸。\n\u003cb\u003e——他死了。\u003c/b\u003e\n\u003cpause=500\u003e“那他怎么办？”不知过了多久，鸟头人终于出声，“这么坐到10点，大概也会死。”\n他说的是狮子，刚才被殴打一顿之后这人已经疼晕过去了，口鼻边上凝着连绵斑驳的血块，整个人像煮过头的面条一般瘫软。\n“把他拖到楼上吧，”山羊蹲下来，“至于他能不能活，我们说了也不算。”\n山羊努力把狮子背了两下，但他头上那对大角显然十分碍事，导致他尝试了几次也没能把人拽起来。\n你并不想多此一举。\n*[【沉默】]\n\u003e“刚才不是装清高弃票了吗？”犀牛对山羊的行为嗤之以鼻，“现在怎么又怕他死了？”\n\u003e山羊大概是已经无力再和犀牛吵架，只扫了他一眼，就继续拽着狮子的胳膊尝试，最终像披风一样把他穿到背上。\n\u003e其他人都陆续回到了房间。现在也没有其他地方可去，还是回房间吧。\n\u003e\u003cpause\u003e【回到房间】\n\u003e~being_beast++\n\u003e-\u003e第一天_回房间\n*[【帮忙】]\n\u003e你叹口气，示意山羊把那具半死不活的人交给你。\n\u003e“刚才不是装清高弃票了吗？”犀牛对你们的行为嗤之以鼻，“现在怎么又怕他死了？”\n\u003e你已经无力再和犀牛吵架，只扫了他一眼，就继续拽着狮子的胳膊尝试，最终像披风一样把他穿到背上。\n\u003e做完这一切后你也懒得管其他人什么反应，歪歪扭扭地架起狮子，山羊在后面拎着狮子的脚，你们就这样把狮子架回了房间。\n\u003e-\u003e狮子房间\n===狮子房间===\n*【狮子房间】\n把狮子弄回房间之后已经过了九点。刚才一番折腾显然让山羊有些吃不消，你也有些疲累，低头瞥见自己衣袖上的血迹便顺手搓了搓，但除了把血迹范围扩大之外并没有任何用处。\n此时，山羊那边也传来一阵窸窸窣窣的衣物摩擦声。\n……\n\u003cpause\u003e实话说，你确实好奇一个长着山羊脑袋的人的身体是什么样子，但你发誓并不是主观故意看到的，只是不小心瞥到。不过从你瞥到的那一眼来说，并没有什么特别的，因为那是货真价实的人类身体，和你相比略显单薄，但并不瘦弱。\n他很白，脊柱的部分被山羊卷毛覆盖，如一条白色的血线般一直延伸到背沟底部——西装裤遮住了那截短而翘的山羊尾巴。\n*[观察]\n~ label++\n\u003cb\u003e他腰侧有一块不起眼的白色的东西……那是什么？\u003c/b\u003e\n@img( \"assets/goatslabel.jpg\")\n还没等你看清，他就已经把衣服再次扣好了。\n山羊本来在低头检查衣服，却在你回头的一瞬间就察觉到了你的动作，于是抬起头往你这边看了过来：\n“刚才衣服黏在身上不太舒服……我有洁癖。”\n“哦、啊，不好意思。”你赶紧移开视线。\n借着微弱的月光，你抬头环视了一下狮子的房间。\n-\u003e检查狮子房间\n===检查狮子房间===\n{ once(\"机会难得，逐一检查【狮子】房间内的陈设吧。\") }\n* [检查床铺]\n\u003e正常的床铺。家具和你房间里的差不多。\u003cb\u003e你找到了遥控器，似乎比你房间内的遥控器要重一些.\u003c/b\u003e\n\u003e~heavy++\n\u003e~clue++\n\u003e*[深入探查]\n\u003e\u003e山羊还在，你不便进一步探查。\n\u003e-\u003e检查狮子房间\n* [检查电视]\n\u003e电视关着。\n\u003e-\u003e检查狮子房间\n* [检查时间和日期]\n\u003e今天是\u003cb\u003e10月17日\u003c/b\u003e，时间为21:40。\n\u003e-\u003e检查狮子房间\n房间里没有其他东西了。\n你和山羊大概恢复了一些体力。时间临近十点，你与他作别，各自回到了自己的房间。\n*【回到房间】\n-\u003e第一天_回房间\n===第一天_回房间===\n即便你对房间以及房间里的电视还有些抗拒，但眼下确实没有更安全的地方——至少能保证只要按照电视的要求去做，就不会轻易死掉吧？\n现在要怎么办？\n*[休息]也很累了，先去洗漱吧。-\u003e卫生间day1\n*[检查房间]为了保证安全，最好再检查一遍房间。\u003c\u003e-\u003eback_to_room2\n===back_to_room2===\n* [检查床铺]\n\u003e正常的床铺。\n\u003e-\u003eback_to_room2\n* [检查电视]\n\u003e电视没什么问题。\n\u003e-\u003eback_to_room2\n* [检查时间和日期]\n\u003e今天是\u003cb\u003e10月17日\u003c/b\u003e，时间正常。\n\u003e-\u003eback_to_room2\n房间里没有其他东西了。现在可以安心去洗漱了。\n-\u003e卫生间day1\n===卫生间day1===\n你仍然十分在意镜子背后是中空的这件事。你观察了一下镜子的结构，发现是镶嵌在墙壁里面的。\n看来是需要一些手段把镜子摘下来了。\n*[😡愤怒的男人可以和北极熊决斗：徒手拆掉！]\n\u003e……你似乎对自己的力量有误解，除了让自己手疼以外，镜子没有受到任何伤害。\n\u003e大概需要【工具】才行。\n*[💡理智的人类可以利用智慧分析：想想办法！]\n\u003e镜子看起来很结实，凭蛮力应该没办法破坏。你需要一些【工具】。\n你再次敲了敲镜面。镜子中的熊头人看起来有些奇怪……\n*[仔细观察]\n你借着镜面仔细观察自己后背的变化。那些附着在你身上的熊毛顺着脊柱连成一条线，隐隐有扩大的趋势。\n\u003cb\u003e你只能勉强看到背脊上的白色熊毛宛如枝干一般，正向四周蔓延。\u003c/b\u003e\n*[离开卫生间]\n【房间内】\n你离开卫生间，回到床上。肚子恰到好处地叫了起来。\n现在也不能出门了，怎么办？就这样睡吗？\n可是真的有点饿啊……\n@if{goats_red_apple===1}\n\u003e你摸摸口袋，意外摸到一个苹果。\n\u003e对了，你想起自己还有一个山羊给的苹果。-\u003eeat_ornot\n@else\n\u003e好像没什么吃的。\n\u003e你饿得要命，但翻遍了房间也没有发现任何能吃的东西，时间也已经指向了10点整。\n\u003e你因为极度的饥饿和口渴而昏睡过去。半梦半醒间，你听到了门锁被转动的声音。\n\u003e你再也没能离开这里。\n\u003e【结局2】饿殍\n-\u003eEND\n===eat_ornot===\n你拿出那个\u003ccolor=red\u003e红色的苹果\u003c/color\u003e。形状很饱满，看起来也很好吃……闻起来除了果香之外，还有一股淡淡的\u003cb\u003e消毒水味\u003c/b\u003e。说起来，在山羊房间门口，你也闻到了那股味道。\n大概他是有洁癖吧？\n你盯着手中的那个苹果犹豫起来。说实话你确实很饿，但是，在这种一不小心就会送命的游戏里，他为什么要给你这个素未谋面的陌生人一个苹果呢？再说了，你刚刚确实没有看到哪里有其他可以吃的东西……他自己吃什么？\n要吃掉吗？\n*[【吃吧】]\n\u003e 不知道山羊给的苹果会不会更好吃一点，毕竟羊吃素比你有经验多了。\n\u003e你端详着这个\u003ccolor=red\u003e红色的苹果\u003c/color\u003e，又凑近闻了闻，并没有什么腐坏的味道。\n\u003e你三两口把苹果吞了下去。\n\u003e\u003cpause\u003e虽然肚子不再叫了，但你躺在床上，还是一点睡意都没有。奇怪的房间、奇怪的人、奇怪的游戏……这一切都有些超出你的承受能力。\n\u003e我为什么会来到这里？你喃喃自语，试图从之前的记忆中寻找可能的线索。\n\u003e但很可惜，你早先的人生可以说乏味至极：学习，工作，日常活动基本上都是从研究所到家的两点一线。你的交际圈子基本上局限于研究所内的同事和领导，再加上你并不擅长维系人际关系，因此朋友也寥寥无几。\n\u003e\u003cb\u003e你唯一能想到的就是，你的哥哥在8月28日失踪了，至今下落不明。\u003c/b\u003e\n\u003e门外似乎传来了一阵脚步声，很快就又远了。\n\u003e黑暗中，监控红灯闪烁着微弱的光。\n\u003e\u003cpause\u003e半梦半醒间，你无法区分那是否是幻觉。\n\u003e-\u003e第一次幻觉\n*[【不吃】]\n\u003e你饿得要命，但出于谨慎，还是没有贸然吃下这个苹果。\n\u003e你因为极度的饥饿和口渴而昏睡过去。半梦半醒间，你听到了门锁被转动的声音。\n\u003e你再也没能离开这里。\n\u003e【结局2】饿殍\n\u003e-\u003eEND\n===第一次幻觉===\n\u003cpause\u003e\u003cfont=幼圆\u003e\u003ccolor=blue\u003e视野里没有画面；你大概是蒙着眼睛的。你察觉到有人接近，伸手覆在你手背上，牵引着直到你手掌贴上他的侧脸。你很熟悉这个触感，轻而易举地就找到了他的嘴巴，并用拇指轻轻按压那片稍厚的下唇。随着你的抚触，他微微张开嘴唇，你感觉到拇指碰到了他的牙齿，在指甲上留下些湿湿黏黏的痕迹。\u003c/font\u003e\n\u003cfont=幼圆\u003e\u003ccolor=blue\u003e他没有说话，只是放松下颌，好让你的手指可以更深入些——你很熟悉这些小动作，于是你抽出手指。他更喜欢接吻，你记得，你很熟悉，直到你感觉他并没有贴到你的嘴唇上，而是轻飘飘地亲在了额头上。\u003c/font\u003e\n\u003cfont=幼圆\u003e\u003ccolor=blue\u003e为什么？\u003c/font\u003e\n\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你没有问出来；他自然也没有回答。你能感觉到他再次握住你的手，将你的食指和中指含住，牙齿咬在骨节上，直到你感觉两根手指完全抵住他的喉口。他发出很轻的干呕声，又因为本能而不住吞咽。\u003c/font\u003e\n\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你伸直手指按在他舌根处，虎口顺势钳住他的下颚，于是他的舌尖便顺从地滑入你两指的指缝，如舔舐一把双管猎枪。你想起以前做这个动作的时候，很轻易地就能用手掌兜住他下半张脸。\u003c/font\u003e\n\u003cfont=幼圆\u003e\u003ccolor=blue\u003e他轻声念你的名字，遥远如海上的塞壬歌声。\u003c/font\u003e\n\u003cfont=幼圆\u003e\u003ccolor=blue\u003e——你开始感到抑制不住的饥饿。\u003c/font\u003e\n*[【第一天结束】]\n今天的死者：豪猪 老虎。\n-\u003e第二天_醒来\n===第二天_醒来===\n*【第二天】\n\u003csize=1.5\u003e\u003ccolor=ghostwhite\u003e\u003cbr\u003e/  “口腔期（或口欲期）是人类性心理发展的最原始阶段，其原始性的性力集中在口部；靠吮吸、咀嚼、吞咽、啃咬等口腔活动，获得快感与满足。若婴儿在口腔期无法通过吮吸、吞咽等口腔活动获得满足，成年后会表现出强烈的‘口欲期滞留’特征，严重者可能表现出神经性暴食、强烈偏执心理等，进一步将发展为幻视、幻听、解离等。”  /\u003c/size\u003e\u003cbr\u003e\u003cbr\u003e\n你感觉身体很不听使唤，精神状态似乎也不是很好。这一觉对你来说没有任何正面的影响，你的头昏昏沉沉，浑身上下仿佛被打了一样痛，睡在床上的姿势也非常奇怪，好像你曾经\u003cb\u003e梦游\u003c/b\u003e后又回到床上了一样。\n你嘶了一声。右手虎口疼的厉害……\n*[检查]\n你发现虎口上有个\u003cb\u003e圆圆的人类牙印\u003c/b\u003e。\n……现在检查一下房间吧。\n-\u003e第二天检查房间\n===第二天检查房间===\n* [检查床铺]\n\u003e正常的床铺。遥控器被你扔到床边了。\n\u003e-\u003e第二天检查房间\n* [检查电视]\n\u003e没什么问题。\n\u003e-\u003e第二天检查房间\n* [检查时间和日期]\n\u003e今天是\u003cb\u003e10月18日\u003c/b\u003e，时间为6点整。\n\u003e-\u003e第二天检查房间\n房间没有什么异常。去检察一下卫生间吧。\n*[卫生间]\n你仔细观察着镜子里的熊头人。\n很小的耳朵，圆而钝的吻部；熊有一对\u003ccolor=royalblue\u003e\u003cb\u003e\u003csize=1.2\u003e蓝色\u003c/color\u003e的眼睛。\n你试着做出张嘴的动作，镜子里的生物也是一样。你试着摸了摸脸颊，毛茸茸的，有些扎手。货真价实的一张熊脸，货真价实的一个熊头，\u003cb\u003e甚至今天连锁骨以上的部分都已经长出了白色的熊的毛发\u003c/b\u003e。\n如果你变的是鸭子，这时候就可以去购买卤料；但你变的是一头熊，你还要再等几天，等变到熊掌再说。你觉得鸭脖不错，熊掌——你不知道熊掌什么味道，\u003cb\u003e但你确实是饿了\u003c/b\u003e。\n~ desire_to_eat++\n从昨天晚上到现在，你几乎没吃什么东西，你太饿了——对，一定是因为太饿了才会想到这些事情。\n你两手紧紧捂住自己的嘴，仿佛这样就能不再边流口水边想那些乱七八糟的事。\n先去找点吃的吧！\n*【走廊】\n你穿过走廊。好安静，你想着；静得有些诡异了，以至于你的脚步也有些迟疑。\n应该这么安静吗？\n这里应该这么安静吗？\n*[往前走]\n好像没什么问题。\n*[往前走]\n\u003cb\u003e消毒水味……\u003c/b\u003e\n*[往前走]\n\u003cb\u003e血味。\u003c/b\u003e\n你终于发现那扇特殊的、半掩着的门。\n连你之前最厌恶的消毒水味道也无法掩盖的那股血腥味，正持续不断地透过门板流到走廊上。门上的动物照片已经被撕下来了，相片的白色纸基吸饱了血，斑斑点点地透出带着水晕的红色圆块，\u003cb\u003e仿佛浸满红油的白面包子\u003c/b\u003e。\n~ desire_to_eat++\n推开门，你想着，我得去看一看死者是谁；手却有些不听使唤，你徒劳地推了半天才察觉门后似乎有什么东西抵住了。\n\u003cb\u003e走到房间里去\u003c/b\u003e，你想着，我得去看一看死者是谁。\n*[推开门]\n你把那扇本应该挂着\u003cb\u003e犀牛\u003c/b\u003e图片的房门推开。\n【犀牛房间】\n-\u003eday1_deadone_room\n===day1_deadone_room===\n{ once(\"逐一检查【犀牛】房间内的陈设吧。\") }\n*【检查床铺】\n\u003e空荡荡的床上扔着一个遥控器，没有任何异样。\n\u003e-\u003eday1_deadone_room\n*【检查电视】\n\u003e没什么问题。\n\u003e-\u003eday1_deadone_room\n*【检查电子表】\n\u003e10月18日，6:05。\n\u003e-\u003eday1_deadone_room\n看来用房间里的物品来判断他身份是行不通的。\n*[🔎深入调查]\n现场非常干净，只有淡淡的消毒水味，凶手很仔细，并没留下什么线索。\n你又环顾了一下周围，目光扫到旁边的摄像头。\n在你试图通过监控查回放的时候意识到，你根本不知道监控的存储数据在哪里可以查看。\n*[【检查现场】]\n犀牛躺在门后，刚才抵住门的是他的腿和脚，整体呈现出一个不自然的角度，半侧着身低头靠在房间角落，你暂时没看到致命伤，于是不得不把他拖出来摆正。\n尸体非常沉重，多叫些人来帮忙或许会更好吧？\n~clue++\n*[【不要多此一举】]\n\u003e但你走过来的时候走廊很安静，大概其他人还没醒，总不好去叫醒他们。\n\u ，在房间内醒了过来。\u003cbr\u003e【结局3】轮回\n\u003e*[兔子]你用那颗子弹射穿了兔子的心脏。在他死亡的瞬间，你两眼一黑，仿佛脑子里有什么崩断了。\u003cbr\u003e——你再一次，在房间内醒了过来。\u003cbr\u003e【结局3】轮回\n\u003e*[狐狸]你用那颗子弹射穿了狐狸的心脏。在他死亡的瞬间，你两眼一黑，仿佛脑子里有什么崩断了。\u003cbr\u003e——你再一次，在房间内醒了过来。\u003cbr\u003e【结局3】轮回\n\u003e*[自己]-\u003e【结束一切】\n*[否]\n\u003e贩卖机内部的齿轮嗡嗡转动，随后回到了初始页面。\n\u003e-\u003e验证身份\n-\u003eEND\n===【山羊已死】===\n这一切已经再也没有了意义，你杀死了你最爱的人。\n【结局4】空枪\n-\u003eEND\n===【结束一切】===\n你对着自己太阳穴扣动了扳机。周围的一切在轰然倒塌，你又看到那面镜子，以及那副手铐。\n如果一切能回到那天就好了，你想。\n【结局5】苦痛\n-\u003eEND\n===找谁===\n你回到了房间。\n~day2nocan++\n【自己的房间】\n不过有些事情或许和同伴交流一下更好……要去找谁呢？\n*[山羊]\n\u003e他算是你在这里比较熟悉的人了。\n*[除了山羊以外的人]\n\u003e你貌似不是很熟悉他们吧……还是去找山羊好了。\n-\u003e去找山羊\n===第二天山羊房间===\n【山羊房间】\n~day2givethecan++\n山羊对你的到来很是意外。你一边简单说明来意一边不自觉地咽了咽口水……山羊的脖子很白净，没有影响观感的毛发，很修长，看起来口感、不是，手感还不错。\n~ being_beast++\n你被自己这样的想法吓了一跳，猛地站起身来，倒把山羊吓了一跳：“怎么了？你还好吧？”\n“……没事！”你把苹果推给他，“我刚买了这个，你吃。谢谢你昨天给我苹果。”\n“那你呢？”\n“我还有一个。”\n“那怎么行？”山羊又推回来。\n\u003cpause\u003e你不想闹饥荒一样对着一个苹果推来让去的，只好转移话题：“你还记得之前的事吗？就是你来到这里之前。”\n山羊顿了顿，又摇头：“我也不知道我为什么会来这里。我好像已经在这里很久了。”\n\u003cpause\u003e气氛一时间有些沉默，你打了个哈哈：“没事，说不定出去之后就想起来了。你这不是还记得自己有个苹果么。”\n你看到他眼睛似乎短暂地闪了闪：“好吃吗？”\n你不知道，你不太挑食。\n“还好，”你决定说实话，“我昨天太饿，不吃东西睡不好。”\n“小孩都这样。”山羊似乎笑了一下。\n“小时候我爸妈不在家，我哥为了让我早点睡觉就讲故事，不过通常是没讲完他自己就睡着了，我就抓着他的衣服。”\n“这样啊，”山羊似乎不感兴趣，“跟我分享的太多了吧。”\n\u003cpause\u003e……好像是这样，你后背都有点出汗，于是默默把苹果推给他，“抱歉，你吃。”\n~clue++\n“谢……昂，等一下。”山羊拿起来，“闻起来不太好吃。”\n“不吃这个就得吃桌子板凳了。”你回答。\n山羊笑了一下，你突然想起他是吃草的，或许还真能吃木头桌椅，于是看他的眼神带了一丝敬佩。\n“对了，”你开口，“有些事想和你说。”\n*[说明来意]\n~shirt++\n-\u003e去找山羊\n===去找山羊===\n你向他说明了昨天晚上死掉的是犀牛，并坦白说你有些担心，因为昨晚在狮子死后，犀牛和山羊产生了口角，所以今天的投票环节可能对他很不利。\n“但如果是出于这样的理由杀人，那也有些太直白了吧？”山羊说，“好像生怕有人不知道凶手一样。而且在我看来，那也不算冲突吧。”\n他的反应很坦然。你并不全然信任他，却本能地不想怀疑他.\n\u003cpause\u003e山羊看你并没有接茬，于是换了个分析思路：“不过第一天的话，线索还是太少，按照这种产生冲突就激情杀人的思路来也是正常的。好人视角全盲，不能轻易相信他人——当然，你也可以不相信我说的，我提供一个思路罢了。”\n他把话说的这样直白，你反而不好再说什么，思虑再三，你开口道：“那你呢？”\n山羊微微一愣：“我？”\n“你的身份。”\n山羊似乎是没料到你会问的这么直白，只好坦言：“我是守卫。我……我没办法证明我的身份，毕竟昨天我守错了人。”\n你稍微放下心来，也和他交代了你自己的身份，但隐去了你不小心把他选为猎物的事。\n山羊点点头：“虽然不是很懂，但你要注意安全。枪什么的似乎很容易走火。”\n连枪都没有怎么走火，因此你只是伸手挠了挠脸颊，露出一个干巴巴的笑来。\n\u003cpause\u003e山羊似乎看了你手背一眼，你这才想起虎口的咬痕，于是立刻把手揣进口袋——好在山羊并没有说什么。\n-\u003e第二天上午回房间\n===第二天上午回房间===\n\u003cpause\u003e你回到了自己房间。\n@if{day2nocan===1}\n\u003e肚子很饿，但现在你没找到什么能吃的东西，而且因为昨晚并没有休息好，你现在更想先睡一觉。\n\u003e\u003cpause\u003e黑暗中，监控红灯闪烁着微弱的光。\n\u003e半梦半醒间，你无法区分那是否是幻觉。\n@else\n\u003e【自己的房间】\n\u003e你回到房间后，先把苹果拿了出来。确实有些不好闻……你抽抽鼻子，但还是决定吃掉。毕竟这还是花了你一些余额兑换出来的，总不好浪费。\n\u003e你吃掉了。\n\u003e\u003cpause\u003e也许是因为昨晚并没有休息好，你往床上倒去的时候便感到了一股无法抵抗的睡意。\n\u003e黑暗中，监控红灯闪烁着微弱的光。\n\u003e半梦半醒间，你无法区分那是否是幻觉。\n\u003cpause\u003e\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你仿佛正陷入某种潮湿的白色泥沼中，每每呼吸都能感觉到潮湿而黏腻的液体正强迫性地从你的口鼻里灌入。\u003c/font\u003e\n*[\u003cfont=幼圆\u003e\u003ccolor=blue\u003e张嘴\u003c/font\u003e]\n\u003e\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你刚把嘴巴张开些缝隙，就感觉口鼻在那片泥沼中陷得更深了，因此你不得不伸出手推拒，直到那片泥沼在你手中展开：衣服下摆、膝盖、伤疤、大腿、耻骨、阴茎、小腹。\u003c/font\u003e\n*[\u003cfont=幼圆\u003e\u003ccolor=blue\u003e闭嘴\u003c/font\u003e]\n\u003e\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你闭紧嘴巴，却感觉口鼻在那片泥沼中陷得更深了，因此你不得不伸出手推拒，直到那片泥沼在你手中展开：衣服下摆、膝盖、伤疤、大腿、耻骨、阴茎、小腹。\u003c/font\u003e\n\u003cpause\u003e\u003cfont=幼圆\u003e\u003ccolor=blue\u003e他兴奋得厉害，前端硬挺着上翘，随着动作而一下下戳在空气中，紧贴着你脸颊两侧的大腿肌肉失控地舒张收紧，翕动如濒死的鱼鳃。\u003c/font\u003e\n\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你握住他的腰侧，汗湿手心贴上去的一瞬间他立刻抖了一下，为了维持住姿势便重心前倾，大概是俯身，因为手下那片柔韧的肌群正如猫被拉长一般真切地舒展开。\u003c/font\u003e\n\u003cpause\u003e\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你将口鼻完全埋入那片潮湿沼泽中，他便条件反射似得用双腿夹紧了你的脸颊两侧——在窒息之前，你听见他在纷乱的喘息之间念出了你的名字，短短三个字，每次都会收紧小腹，夹得你舌头发麻；你尝到些许腥甜的味道。\u003c/font\u003e\n\u003cfont=幼圆\u003e\u003ccolor=blue\u003e他薄薄地伏在床上，一只手呈现出一个不自然的角度握住床头。\u003c/font\u003e\n\u003cfont=幼圆\u003e\u003ccolor=blue\u003e\u003cb\u003e——他被铐住了手腕。\u003c/font\u003e\n-\u003e第二天讨论\n===第二天讨论===\n*[惊醒]\n这次休息没有给你带来任何正面的效果，你觉得头痛欲裂，不得不在床上缓了很久，直到时钟滴答声重新进入你的脑海。\n*[查看时间]\n时间已经到了临近七点。到时间了，先去投票吧。\n【大厅】\n不知道是不是没吃饱的原因，大部分人脸色不佳，昨天受了重伤的狮子更是进气比出气少。\n“都拉个驴脸给谁看啊？”鸟头人十分不满，“今天到底还投不投票了？一口气都死了三个人了，晚上再死俩好人，我看就真完了。”\n你知道他说的是对的。虽然从你的视角来看，守卫和猎人还活着，明天不一定会造成狼人和其余角色数量相等，但你只能这样想，并不能拿出有力的证据来让人信服。\n山羊大概想的和你也差不多，此时也转过头来，和你面面相觑。\n“有没有好人啊？”鸟头人又开口，“预言家呢？验了没有？不会是死了吧？”\n*[……]\n虽然你不太懂游戏规则，但预言家这么 吗？”\n*[【觉得可笑】]\n\u003e你觉得有些可笑：“他对你来说是人，你把其他人当什么？他们当然也是人命啊。”\n\u003e斑马还没说话，你又补上一句：“还是说只有他对你来说很重要？你们是什么关系，情侣吗？”\n\u003e~being_beast++\n*[【无言以对】]\n\u003e“我没有要杀了他，”你嗓子发干，“我只是不想死。”\n-\u003e第二天投票\n===第二天投票===\n时间已经指向了19:50.\n“现在怎么办？”鹿头人说，“你们俩谁是真的啊？唉我、我……谁也得罪不起，投……啊！”\n他好像发现新大陆一般指着狮子，“投他吧！反正他这样早晚会死！”\n狮子显然是没料到战火突然烧到了他身上，顿时急得大叫：“我不同意！！！凭什么？！你说的什么话啊？！”\n\u003cpause\u003e……他说的似乎不无道理。\n狐狸也点了点头：“刚才讨论的时候你就没说话，明明第一天还很积极地挑衅别人。”\n“我没有挑衅啊！”狮子嗓子都劈了，“我、我……要不是我，你们怎么能活下来，万一都不投票，全死了怎么办？！”\n“现在也是为了我们活下来啊，”斑马接话，“我记得你说的是‘今天晚上把你投出去，我们也能活下来’，难道放你身上就不适用了？”\n这实在是太荒谬了。你虽然讨厌狮子，但现在来看，斑马、鸟和狐狸绑票的可能性更大一点。\n要投给谁？\n*[斑马]鹿、斑马、鸟、狐狸和兔子投给了狮子，共计5票，而你投给了斑马。\n*[鸟]鹿、斑马、鸟、狐狸和兔子投给了狮子，共计5票，而你投给了鸟头人。\n*[狐狸]鹿、斑马、鸟、狐狸和兔子投给了狮子，共计5票，而你投给了狐狸。\n*[狮子]鹿、斑马、鸟、狐狸、兔子和你投给了狮子，\u003cb\u003e共计7票\u003c/b\u003e。\n\u003cpause\u003e狮子颈上的项圈红灯频闪，干脆利落地结果了他的生命。你看着他的尸体，一时不知该作何想法。\n“装什么假慈悲，”鸟头人嗤笑，“难不成今天你也要把尸体搬上去？”\n“你又为他打抱不平了？”你懒得和这鸟人再拌嘴，“刚才怎么不吭声？”\n山羊拽住你：“我们走吧。”\n你离开了大厅。\n-\u003e狮子的项圈\n===狮子的项圈===\n\u003cpause\u003e你离开大厅之后，脚步越来越迟疑，最后甚至站在原地，感觉后背上冷汗已经浸湿了衣服。\n刚才你突然感觉到似乎有什么力量在操控你一般，让你完全没有经过大脑就条件反射一般说出了那些话。\n\u003ccolor=royalblue\u003e\u003cb\u003e\u003csize=1.2\u003e这样不好吗？\u003c/color\u003e\n你顿住了。\n\u003ccolor=royalblue\u003e\u003cb\u003e\u003csize=1.2\u003e你不是不想死吗？我这是在帮你啊。\u003c/color\u003e\n你难以置信地回头。人们都已经走了，只剩狮子的尸体还躺在地上。\n幻听？还是尸体在说话？\n*[【回房间】]\n\u003e还是先回房间吧。-\u003e第二天镜子\n*[【回大厅】]\n你又折返回去，蹲下身探了探狮子的鼻息。\n刚死不久，还很新鲜……但确实死了。\n你又用指腹贴上他颈侧,发现他的颈部直接被项圈割断了。之前你也看过犀牛的尸体，他死于刀伤，而狮子是死于割喉，也就是说\u003cb\u003e因规则而死和因狼人杀人而死是有区别的\u003c/b\u003e。\n*[深入调查]\n你借着窗户外的一点光亮仔细观察着狮子：以项圈附近的切口为分界线，脖子以下的皮毛还是很服帖地生长在身上，但脖子以上的皮毛歪歪扭扭——或许说是被剥离了下来更为贴切。因为切口出血量太大，你忽略了从皮毛下方渗出的斑斑点点的血迹。\n*[检查切口]\n你伸手试探着拽了拽狮子的脸部皮肤，随着你的拉拽，皮毛逐渐失去弹性，被撑大到一定程度便无法再继续。你强忍着恐惧，用另一只手摸了摸他毛皮底部——\n很腻，手感像猪油……但，这绝对是正常的人类皮肤。\n因为你的拉拽，不知何时已经被解开的、沾着\u003cb\u003e狮子的血\u003c/b\u003e项圈也啪嗒一声掉在了地上。\n*[【捡起】]\n你获得了【狮子的项圈】。\n~clue++\n~lionchocker++\n你不敢再逗留，逃也似的回到了房间。\n-\u003e第二天镜子\n===第二天镜子===\n\u003cpause\u003e【回到房间】\n@if{lionchocker===1}\n\u003e你仔细观察着那个项圈：没有遭受过任何外力破坏，是电子扣自己松脱后掉下来的。也就是说，“规则”在执行完毕后，就会自动解开项圈。\n\u003e你搓了搓手指。项圈上未干的血沾了你满手。\n@else\n去洗个手吧。\n*【卫生间】\n你仔细清理了自己手上的血迹，抬头时，在镜子里突然看到自己脸上也沾了一些。什么时候？你顺手搓了搓脸颊毛，虽然不是自己的脸，但毛毛黏糊糊的很不爽……\n\u003ccolor=royalblue\u003e\u003cb\u003e\u003csize=1.2\u003e谢谢。\u003c/color\u003e\n你难以置信地抬头看向镜子，那里面映出一张疲惫不堪的脸，你甚至隐约觉得毛流形成了深深的两道泪沟。\n你后背发冷，手不自觉地抬起，清理脸上沾着的一处血迹。\n*\u003ccolor=royalblue\u003e\u003cb\u003e\u003csize=1.2\u003e清理\u003c/color\u003e\n你仔细清理其中一绺短毛。\n*\u003ccolor=royalblue\u003e\u003cb\u003e\u003csize=1.2\u003e清理\u003c/color\u003e\n你仔细清理另一绺短毛。\n再抬头的时候，镜子里的人似乎没有和你一齐抬头，还在继续低着头搓洗那绺短毛。\n*停止\n你看到镜子里的自己继续揪起短毛，手指穿过短毛和皮肤的缝隙，一点一点探进去，然后是指根，掌心，直到整只手完全探了进去，在镜子里映出包裹着手掌的皮肤形状。\n*\u003ccolor=royalblue\u003e\u003cb\u003e\u003csize=1.2\u003e停？！止\u003c/color\u003e\n你看到镜子里的人手指用力向外撑开，顿时一阵令人牙酸的皮肉撕扯声传来。\n*\u003csize=1.2\u003e\u003cb\u003e停下！！！\u003c/size\u003e\n你刚才那一阵强行撕扯已经制造出了不小的伤口，镜子里的人胸口顿时血迹斑斑。\n你……不，他，突然抬头，一双蓝色的眼睛直直盯着你，并举起血淋淋的手掌贴上玻璃，\u003csize=1.2\u003e\u003cb\u003e下一秒便毫无预兆地张开了血盆大口——\u003c/size\u003e\n*\u003cb\u003e\u003csize=2\u003e跑！！！\u003c/b\u003e\n你打开门慌不择路地冲出房间，却和什么人撞了正着，直把他撞得往旁边踉跄几步。你赶紧伸手拽住他，他这才看清你的样子：“是你？”山羊歪歪扭扭地站定，“还好吧？发生什么了？”\n你冷汗止不住地往下流：“我，我刚才在镜子里看到……”\n“什么？”山羊揉了揉自己的鼻子，“别着急，怎么了？”\n你鼻腔中涌入一股消毒水的味道。\n要告诉他你看到了什么吗？\n*【如实相告】\n\u003e~heknowsthemirror++\n\u003e“我看到镜子里有另外一个人。”你开口，“他和我一模一样，第一晚的时候我没看出来……但是，他动作和我不一样，我……”\n\u003e山羊有些疑惑，碍于头上角太重了，他不得不伸手托着两边歪头看着你。\n\u003e“是真的！”你把他往门外扯，“现在去我房间，我证明给你看。”\n\u003e山羊拗不过你，只好好言相劝：“我知道，但是现在真的快到时间了。太晚了，说不定你看错了。这几天发生的事情太多，你需要休息，好好睡一觉，好吗？”\n\u003e你张张嘴，却什么都没说出来。\n\u003e“\u003cb\u003e规则会保护你的。\u003c/b\u003e”他摸摸你额头，手心很凉，“你在这里很安全，不是吗？”\n\u003e“我……”\n\u003e“太晚了，”他摇头，“马上就十点了。”\n\u003e你想说你没看错，但他凭什么相信你，而且向他证明以后又能怎样？你不知道。\n\u003e最后你颓然地松开了手，扯出一个笑来：“抱歉……谢谢，那我、我先回去了。”\n\u003e@if{day2givethecan===1}\n\u003e\u003e\u003cpause\u003e就在你转身的时候，山羊从背后叫住了你，然后撕下一边有些许血迹的衣角放到你手里：“我也没什么好办法，你试试，说不定能让你睡得好点呢。”\n\u003e\u003e你攥着那爿衣角。奇怪的是，你确实安心了许多。\n\u003e\u003e~goatsshirt++\n\u003e\u003e@img(\"assets/gettheclue.jpg\")\n\u003e@else\n\u003e\u003e山羊点点头，而后礼貌地与你作别。\n*【缄口不言】\n\u003e@if{day2givethecan===1}\n\u003e\u003e他或许不会相信你，并且，你也无法确定刚才那是不是你的幻觉。\n\u003e\u003e你松开手：“抱歉，刚才可能是我过度反应了……没什么大事。”\n\u003e\u003e就在你转身的时候，山羊从背后叫住了你，然后撕下一边有些许血迹的衣角放到你手里：“我也没什么好办法，你试试，说不定能让你睡得好点呢。”\n\u003e\u003e你攥着那爿衣角。奇怪的是，你确实安心了许多。\n\u003e\u003e~goatsshirt++\n\u003e\u003e@img(\"assets/gettheclue.jpg\")\n\u003e@else\n\u003e\u003e他或许不会相信你，并且，你也无法确定刚才那是不是你的幻觉。\n\u003e\u003e你松开手：“抱歉，刚才可能是我过度反应了……没什么大事。”\n\u003e\u003e山羊点点头，而后礼貌地与你作别。\n回去吧。\n-\u003e第二天睡觉\n===第二天睡觉===\n*[【回到房间】]\n你疲惫地打开房门。电视闪动一下，弹出你第一天见过的那个画面：\n\u003cfont=黑体\u003e\u003ccolor=red\u003e\u003csize=1.5\u003e\u003cb\u003e欢迎回来，玩家！恭喜您存活到了第二天。\u003cbr\u003e请选择本次猎物.\u003c/font\u003e\n你拿起遥控器。今天要选择谁？\n*[山羊]\n*[斑马]\n*[鸟]\n*[狐狸]\n*[兔子]\n*[鹿]\n*[熊]\n你完成了选择。时间指向十点，你躺倒在床上。\n@if{day2nocan===1}\n\u003e由于一整天你都没有进食，你的饥饿感已经快要将你彻底吞没了。\n\u003e*\u003ccolor=royalblue\u003e\u003csize=1.2\u003e进食\u003c/color\u003e\n\u003e饿一天应该也没什么，没关系的……\n\u003e*\u003ccolor=royalblue\u003e\u003csize=1.3\u003e进食\u003c/color\u003e\n\u003e你确实需要……不，我……\n\u003e*\u003ccolor=royalblue\u003e\u003csize=1.5\u003e进食\u003c/color\u003e\n\u003e你打开房门。门外有很多食物，只是需要你动手而已，不是吗？\n\u003e楼道间昏黄的灯光把你的影子拉长，你看到你的脊背隆起、身影变形，直至完全扭曲成一团模糊的、似熊非熊的怪物。\n\u003e\u003ccolor=royalblue\u003e\u003csize=1.3\u003e忠于你的欲望吧。\u003c/color\u003e\n\u003e【结局11】犹斗\n\u003e-\u003eEND\n@else\n\u003e一切都指向了那面镜子……或许你需要尽快找到打开镜子的办法。\n\u003e-\u003e第二天死亡支线\n===第二天死亡支线===\n黑暗中，监控红灯闪烁着微弱的光。\n半梦半醒间，你无法区分那到底是你的幻觉还是真实。\n\u003cpause\u003e\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你伸手从他肋下穿过，环抱的姿势让你很轻易地就摸到了他的脖颈。\u003c/font\u003e\n*[松手]\n\u003e\u003cfont=幼圆\u003e\u003ccolor=blue\u003e他略微偏过头来，汗湿鬓角亲昵地贴上你的脸颊，又慢慢伸手覆在你的手背上；你能感觉到他一直在抖。\u003c/font\u003e\n*[勒紧]\n\u003e\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你不断收紧手指，直直把他送上一场疯狂的窒息性高潮。\u003c/font\u003e\n\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你叫他的名字，他并没有应答，喉咙里反复咕哝着一些干涸的词句。你将耳朵贴近他的嘴边，他却不再出声。\u003c/font\u003e\n\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你知道你没有听清，你也知道他不会再说下一次。\u003c/font\u003e\n\u003cpause\u003e\u003cfont=幼圆\u003e\u003ccolor=blue\u003e你低下头，锋利的犬齿咬穿他的下唇，又再一次锁紧了手铐。\u003c/font\u003e\n\u003cpause\u003e\u003cfont=幼圆\u003e\u003ccolor=blue\u003e\u003csize=1.5\u003e\u003cb\u003e不要离开我，你想。\u003c/font\u003e\n*[【第二天结算】]\n今天的死者：犀牛 狮子\n-\u003e第三天_醒来\n===第三天_醒来===\n*【第三天】\n\u003csize=1.5\u003e\u003ccolor=ghostwhite\u003e\u003cbr\u003e/  “根据脑电波监听曲线可知，‘\u003ccolor=aqua\u003e\u003cb\u003e镜子\u003c/b\u003e\u003c/color\u003e’是梦境中链接正面意识与负面意识的桥梁。绝大部分时期，正面意识在镜子以外，作为患者的主人格；负面意识在镜子以内，作为患者的副人格。在梦境中，两者互为二重身，并且，\u003ccolor=aqua\u003e随着患者在梦境中停留时间的增长，二重身之间的界限将不复存在，最终仅保留更为强势的一种人格\u003c/color\u003e。”  /\u003cbr\u003e\u003cbr\u003e\u003csize=0.9\u003e*二重身：由德国作家让·保罗在《齐本凯斯》中首次提出，即看见了自己的人。学界认为，二重身就是制造性欲、食欲等欲望的根源。\u003c/size\u003e\u003c/size\u003e\u003cbr\u003e\u003cbr\u003e\n你浑身像被谁打了一样剧痛，光是下床站定的动作都耗费了不少精力。\u003cb\u003e你正在逐步丧失对身体的控制权，仿佛灵魂正在顺着背后枝干一样的附着物抽离，化作一滩烂泥。\u003c/b\u003e你痛恨这种感觉，你也痛恨将你变成这样的源头；但没有目标的恨只是无用功。\n*[检查仪容仪表]\n你嘴边出现了血迹，但你很清楚昨天只吃了苹果，而苹果不可能流血。\n你盯着镜子里的那个人看，同样的，他也沉默地回望着你。\n你脱下上衣，背后熊毛形成的轨迹已经连成一片，新长出的皮肉渗出斑斑点点的血迹，仿佛一张细密的网。从进度来看，大概要不了多久，你就会彻底失去人类的特征。\n*[【仔细检查】]\n你继续打量这面镜子。你觉得熊头人的目光十分陌生，带着冷峻的审视意味。\n*[扭头]\n……大概是这几天看到的无法接受的事情太多导致了幻觉。出去呼吸一下新鲜空气吧。\n-\u003e第三天出门\n===第三天出门===\n*[排查]\n通过血迹排查，你发现昨晚的死者是狐狸。\n*[探查狐狸的房间]\n【狐狸的房间】\n狐狸的尸体并没有被塞到奇怪的地方，只是表情有些狰狞。他同样死于刀伤，还有部分血迹没有完全清理干净，大概是凶手擦完之后又流出来的，凝成了一个小泊，像蛋糕上插着的红色透明翻糖片……\n什么乱七八糟的，饿晕了吧？\n你摇摇头，继续环视房间：监控的红灯已经熄灭了，其余并没有留下什么能作为证据的痕迹。但是，他昨晚已经说了自己的身份是预言家，他的死对兔子来说有些威胁，而你算是和兔子在统一战线上，他的死对你来说也有些棘手。\n你再次查看了他的尸体，没什么特别的，屋里仍然有一股淡淡的消毒水味道。\n你没有急着离开。能单独碰到尸体的机会很难得，而你确实有件事实在想要验证一下。\n*[【狐狸的项圈】]\n你想要收集狐狸的血液来多换一些物资。\n你拽了拽项圈，但项圈没有松脱。\n他并不是被项圈割喉而死的，项圈没办法摘下来……也许需要【工具】才行。\n*[去找工具]\n现在有几个房间因为主人死掉所以没有上锁。要去哪里？\n-\u003e巡查\n===巡查===\n*【狮子的房间】\n\u003e-\u003e捡到刀\n*【犀牛的房间】\n\u003e-\u003e无异常\n*【豪猪的房间】\n\u003e-\u003e无异常\n*【老虎的房间】\n\u003e-\u003e无异常\n没什么可以检查的了。\n*【回到狐狸的房间】\n-\u003e回到狐狸的房间\n===无异常===\n*[【检查床铺】]\n\u003e正常的床铺。遥控器重量很正常。\n\u003e-\u003e无异常\n*[【检查电视】]\n\u003e没什么问题。\n\u003e-\u003e无异常\n*[【检查电子表】]\n\u003e10月19日，时间正常。\n\u003e-\u003e无异常\n没有什么异常。\n-\u003e巡查\n===捡到刀===\n*[【检查床铺】]\n\u003e正常的床铺。遥控器有点重。\n\u003e-\u003e捡到刀\n*[【检查电视】]\n\u003e电视已经关机了。使用遥控器也无法开机。\n\u003e@if{heavy===1}\n\u003e\u003e*[【深入探查】]\n\u003e\u003e\u003e遥控器的背板似乎可以拆开。他的遥控器内部并没有电路板，只有一把很短的刀。\n\u003e\u003e\u003e你获得了【刀】。\n\u003e\u003e\u003e@img(\"assets/knife.jpg\")\n\u003e\u003e\u003e~knife++\n\u003e@else\n\u003e\u003e你并没有发现什么不对。\n\u003e-\u003e捡到刀\n*[【检查电子表】]\n\u003e10月19日，10:00。\n\u003e-\u003e捡到刀\n-\u003e巡查\n===回到狐狸的房间===\n@if{knife===1}\n\u003e*[用刀取下项圈]\n\u003e\u003e你获得了【狐狸的项圈】。\n@else\n\u003e*[收集狐狸的血液]\n\u003e\u003e没办法了……你用衣服沾了一些狐狸的血液。\n\u003e\u003e~xianyi++\n-\u003e第三天贩卖机\n===第三天贩卖机===\n你收集到了狐狸的血液。回到贩卖机那里吧。\n【贩卖机】\n@img(\"assets/loading.jpg\")\n*[\u003cb\u003e忘记编号？点此验证身份\u003c/b\u003e]\n你还记得昨天的流程。\n*[验证血液]\n@if{xianyi===1}\n\u003e你用衣服上狐狸的血迹进行了血迹验证。\n@else\n\u003e你用狐狸的项圈进行了血迹验证。\n\u003cpause\u003e\u003ccolor=red\u003e已验证身份信息\u003c/color\u003e\n\u003ccolor=red\u003e正在检测余额，请稍候……\u003c/color\u003e\n\u003cpause\u003e\u003ccolor=red\u003e检测到余额为：\u003cb\u003e\u003cu\u003e100%\u003c/b\u003e！\u003c/color\u003e\n在你还想继续深入调查时，界面切换了：\n@img(\"assets/tryagain.jpg\")\n*[……]\n为什么狐狸的余额会是\u003ccolor=red\u003e100%\u003c/color\u003e？\n你心中大致有了个猜想……但这还需要验证才行。\n@if{lionchocker===1}\n\u003e*[狮子的项圈]\n\u003e你还需要找一些其他人的血液来验证你的猜想：你想到昨天拿走的狮子项圈。\n\u003e你掏出狮子的项圈进行了血迹验证。\n\u003e\u003cpause\u003e\u003ccolor=red\u003e已验证身份信息\u003c/color\u003e\n\u003e\u003ccolor=red\u003e正在检测余额，请稍候……\u003c/color\u003e\n\u003e\u003cpause\u003e\u003ccolor=red\u003e检测到余额为：\u003cb\u003e\u003cu\u003e100%\u003c/b\u003e！\u003c/color\u003e\n\u003e和你料想的一样，在你还想继续深入调查时，界面切换了：\n\u003e@img(\"assets/tryagain.jpg\")\n\u003e\u003cpause\u003e果然……\u003cb\u003e死者\u003c/b\u003e的余额都是100%。这个百分数大概也不是什么余额，而是检测你的某一项指标并转换成“货币”来使用。\n\u003e~clue++\n@else\n\u003e你还需要找一些其他人的血液来验证你的猜想……昨天如果收集到狮子的血液就好了。你有些懊悔。\n@if{goatsshirt===1}\n\u003e你又拿出了山羊的衣角。这上面有一些血迹……或许会帮到你。\n\u003e\u003cpause\u003e\u003ccolor=red\u003e已验证身份信息\u003c/color\u003e\n\u003e\u003ccolor=red\u003e正在检测登录环境，请稍候……\u003c/color\u003e\n\u003e\u003ccolor=red\u003e【请输入锁定密码，以查看监控回放！】\u003c/color\u003e\n\u003e-\u003e是否\n@else\n\u003e……\n\u003e你有点尴尬地摸了摸口袋。好像什么都没有。\n\u003e你点开自己的购买界面。余额已经变成了\u003cpause\u003e\u003ccolor=red\u003e\u003cb\u003e\u003cu\u003e60%\u003c/color\u003e，但由于昨天兑换已经消耗了20%，你实际可以使用的只有40%。\n\u003e*[兑换两个苹果]\n\u003e你获得了两个苹果。现在也没什么其他事情了，回到房间吧。\n\u003e*【回房间】\n\u003e-\u003e第三天回到房间\n===是否===\n@if{suodingcishu\u003c3}\n\u003e@input(inputsuoding,\"锁定密码\")\n\u003e@if{inputsuoding === suoding}\n\u003e\u003e-\u003e【一切的结局】\n\u003e@else\n\u003e\u003e~suodingcishu++\n\u003e\u003e\u003ccolor=red\u003e锁定密码错误！已尝试{suodingcishu}次。\u003c/color\u003e\n\u003e\u003e-\u003e是否\n@else\n\u003e账号已锁定。请2小时后重试。\n\u003e……没办法了，或许还需要找一些别的线索吧。\n\u003e你点开自己的购买界面。余额已经变成了\u003cpause\u003e\u003ccolor=red\u003e\u003cb\u003e\u003cu\u003e60%\u003c/color\u003e，但由于昨天兑换已经消耗了20%，你实际可以使用的只有40%。\n\u003e*[兑换两个苹果]\n你获得了两个苹果。现在去找一下【密码】的线索吧。\n-\u003e寻找id卡\n===寻找id卡===\n{ once(\"从哪里开始搜起呢？\") }\n*【在大厅内搜索】\n\u003e@img(\"assets/emptylobby.jpg\")\n\u003e你认真地搜寻了一圈，但一无所获。\n\u003e-\u003e寻找id卡\n*【上楼去房间里搜索】\n\u003e@img(\"assets/2thfloor.jpg\")\n\u003e其他门都已经上锁了。暂时不能去其他地方……先回到自己的房间吧。\n\u003e-\u003e第三天回到房间\n===第三天回到房间===\n你摸了摸口袋，\u003c\u003e\n@if{knife===0}\n\u003e口袋里什么都没有。\n\u003e没办法了……你用蛮力破坏了镜子。\n\u003e~mirrorbroke++\n\u003e镜子碎了一地。\u003cb\u003e你似乎感觉到什么链接轻轻崩断了\u003c/b\u003e，只留下你一个人。\n\u003e窗外不知何时乌云密布，偶有雷声传来。\n\u003e你并没有找到什么。或者说，你也并不在乎了。\n@else\n\u003e摸到了那把刀。现在有【工具】了，或许可以拆掉镜子。\n\u003e你来到卫生间。\n\u003e*[【用刀从镜子和墙之间的缝隙撬开】]\n\u003e\u003e你把镜子完整地从墙上取了下来。镜子背后放了一把钥匙。\n\u003e\u003e@img(\"assets/gotkey.jpg\")\n-\u003e第四次幻觉\n===第四次幻觉===\n你再次沉入了幻觉。\n\u003cpause\u003e\u003ccolor=blue\u003e\u003cfont=幼圆\u003e雾气无孔不入地钻进你的身体，你就在这种近乎失能的窒息中盲目地抓紧了他。不要怕，他说，而后将你抱进怀里。\u003c/color\u003e\n\u003ccolor=blue\u003e\u003cfont=幼圆\u003e你很熟悉这种感觉。是的，在你的童年，不……在你和他相依为命的时候。那个昏暗的房间内，他曾经在这里睡了十个月，而你如今也躺在那里，等待着生命曙光的降临。\u003c/color\u003e\n\u003ccolor=blue\u003e\u003cfont=幼圆\u003e我会陪你的。他用一个不太熟练的姿势抱紧了你，额头贴上你皱巴巴的脸颊，并用九岁的手轻拍你的后背，那扇父亲和母亲不会再踏进的房门就这样在他哼唱摇篮曲的声音中永远地关闭了。\u003c/color\u003e\n\u003ccolor=blue\u003e\u003cfont=幼圆\u003e你还记得吗？他第一次在你身边睡着。你握紧他的衣角，仿佛这样就能永远找到他。\u003c/color\u003e\n*[□□]\n\u003ccolor=royalblue\u003e\u003cfont=幼圆\u003e\u003cb\u003e我们会一直在一起。\u003c/b\u003e\u003c/color\u003e\n\u003ccolor=blue\u003e\u003cfont=幼圆\u003e\u003csize=1.2\u003e\u003cb\u003e我们会一直在一起。\u003c/b\u003e\u003c/color\u003e\n\u003ccolor=#000080\u003e\u003cfont=幼圆\u003e\u003csize=1.5\u003e\u003cb\u003e我们会一直在一起。\u003c/b\u003e\u003c/color\u003e\n\u003ccolor=blue\u003e\u003cfont=幼圆\u003e你一遍一遍咀嚼这个句子，过盛的食欲让你不得不吞下对他多余的感情，又在深夜时分一滴不剩地呕了出来。没有人听见这个时限是永远的咒语，除了那面镜子，那面满是雾气的、映着你无休无止欲望的镜子。\u003c/color\u003e\n*[擦去雾气]\n\u003ccolor=blue\u003e\u003cfont=幼圆\u003e镜子里露出你们交缠的身体，他的脊背，他光裸的脆弱的脖颈，他被铐住的手腕，他最后一滴眼泪，以及你的脸：\u003c/color\u003e\n\u003cpause\u003e\u003ccolor=blue\u003e\u003cfont=幼圆\u003e\u003cb\u003e\u003csize=1.2\u003e你看到一双蓝色的眼睛。\u003c/color\u003e\n-\u003e第三天投票\n===第三天投票===\n*[惊醒]\n你从梦中惊醒，额头上冷汗涔涔。\n那究竟是谁？可你根本没有那种印象，你并没有……\u003cb\u003e那是你吗？\u003c/b\u003e\n@if{xianyi===1}\n\u003e*【是的】\n\u003e你将脸埋入沾着狐狸血迹的衣服里。你不再去想那些、不再去管那些——他们都消失才好。\n@else\n\u003e*【无法确定】\n\u003e你没有再去看镜子。\n*[去大厅]\n【大厅】\n@if{mirrorbroke===1}\n\u003e天空已经无限逼近地平线。即便窗户依然紧闭着，你仍然能感觉到那股风穿透墙壁、穿透身体，将你的心吹成满涨的帆。\n\u003e大厅里，灯光正一闪一闪，昭示着这里的一切即将失去控制，而其他人依旧惶惑地、茫然地遵守着那些失去效力的准则。\n\u003e你能听到后背的枝干在生长。\n@else\n“……总之，兔子肯定不是真预言家了。”斑马说，“今天投他。”\n“我怎么就不是了！”兔子急得话都说不利索，“他、他……他死了也不能说明他就是真的啊！”\n“难道说你觉得狐狸是宁可自己死，也要栽赃你吗？”斑马不以为然。\n兔子的脸胀得通红。\n\u003cpause\u003e“等一下。”鹿头人举手，“既然你说自己是真的，那昨晚你验了谁？”\n兔子指着鸟头：“他，我昨天验了他，他是狼……”\n“不是你什么逻辑验我啊？”鸟头人额角青筋暴起，“狐狸和你对跳，保的是斑马，再怎么说也该验他吧？”\n\u003cpause\u003e“狐狸都和我对跳了肯定是狼啊，那斑马就应该是他的队友了，”兔子一直在抹眼泪，“现在六个人，游戏没结束，那就是狼死了至少一个了……我本来以为就是狐狸和斑马的，但是昨天你一直帮他们说话啊，这不很可疑吗……”\n“这不是栽赃吗？！”鸟头人大叫，“你今天看到狐狸死了，知道自己的假身份保不住就说验出了狼，哪有这么准的事啊？！”\n山羊：“这种巧合也不是不可能发生。而且昨天你确实一直在帮斑马说话，很奇怪。”\n“情侣吧。”鹿头人接茬，“狐狸、斑马还有鸟，刚好三个人。估计狐狸不是他们一边的，丘比特跳预言家之后被狼杀了呗。还刚好坐实斑马的好人身份，啧啧。”\n“那照这个逻辑，兔子和熊也一样可疑。”斑马说，“昨天山羊也是帮兔子和熊说话了，为什么不怀疑他们？”\n@if{xianyi===1}\n\u003e“是啊，”鸟人接茬，“他衣服上还有血迹。”\n\u003e……是你之前用来收集狐狸血迹的衣服！\n\u003e“如果我是凶手，为什么要留下这么明显的痕迹？”你一再劝告自己冷静。\n\u003e“百密一疏呗。”斑马说，“狐狸死之前抓了你的衣服，血就这样蹭上了。”\n\u003e不行、不行……现在不是争论这些的时候。斑马和鸟一定绑票了，只要你冷静下来，至少兔子是肯定不会投你的。\n\u003e你又开始咬手上的死皮，但这一次你脑海中的那个声音并没有再帮你。你辩驳了几句，但很快感到力不从心——你每天晚上都休息不好，熊的部分似乎每天都在吞没你的神志。\n\u003e如果……\n\u003e*\u003ccolor=blue\u003e\u003cb\u003e\u003csize=1.2\u003e如果你早点接受这一切\u003c/color\u003e\n\u003e\u003e你垂下手。那个声音，不，他……或者说……\n\u003e\u003e在这场长久的拉锯战中，扮演一个正常人，扮演一个贴心的孩子，扮演一个格子里的人，扮演一个世俗的异性恋，扮演一个健康健全的人，扮演一个……\n\u003e\u003e这一切的一切已经让你精疲力竭。\n\u003e\u003e背后熊毛顺着你的躯干蔓延，直至把你完全吞没；你在山羊的金黄色的眼睛中看到了张着血盆大口的怪物，一如你在镜中所见的那样。\n\u003e\u003e【结局10】困兽\n\u003e\u003e@img(\"assets/turntobear.jpg\")\n\u003e\u003e-\u003eEND\n\u003e*\u003ccolor=blue\u003e\u003cb\u003e\u003csize=1.2\u003e如果他们都消失就好了\u003c/color\u003e\n\u003e\u003e-\u003e第三天投票结果\n@else\n\u003e-\u003e第三天投票结果\n===第三天投票结果===\n\u003cpause\u003e“也不能乱咬啊，”你回答，“兔子有身份，你又没有身份。”\n斑马：“和他对跳的预言家死了啊，这怎么可能说明他是好人？！”\n“你们情侣给泼脏水呗，”鹿头人回答，“投票就知道了。”\n“等一下！！！”鸟头人大叫，“你们不能投我！我是猎人！我死了一定会带走我选中的人的！”\n这太明显了。你胸口重重起伏，抬头看着指示时间的钟。\n时间到了。\n*[投给鸟]\n投票结果出来了。斑马和鸟投给了兔子，其余人投给了鸟。\n“你瞎说八道什么啊！”斑马崩溃了，“你昨天为什么要接茬！我都说了别说话别说话，非得多那一句嘴！”\n“我不是怕你死了吗？！”鸟头人叫的比他更大声，“你死了我也会死啊！？”\n“我昨天身份还是好的呢你跳出来干什么啊？！！！！”\n“你还怪上我了？！要不是我帮忙你昨天就死了！！！”鸟头人攥住斑马的脖领子，“我怎么这么倒霉，跟你绑一起……”\n鸟头人的话还没说完，项圈便已经割开了他的喉咙，鲜血喷了斑马一头一身。\n斑马面色灰败，腿一软瘫坐在地上，双手紧紧抓着自己的项圈，而后也以同样的死法倒在了鸟人旁边。\n\u003cpause\u003e把情侣揪出来后，你并没有想象的那么轻松。那些人，那些事，那些规则，那些血肉横飞的场面，那些争吵，无一不让你感到精疲力竭。\n*[回到房间]-\u003e第三天晚上\n===第三天晚上===\n【房间】\n你来到洗手间。\n@if{mirrorbroke===1}\n\u003e你面对着那堆碎片，看到无数个熊、无数个人，被分割、变形，拼凑出一只茫然的怪物。你感觉身上的力气已经完全被抽离，便颓然地靠着墙壁坐下，一点一点剥下身上的衣服——它们已经让你觉得无比束缚。\n\u003e*[触摸]\n\u003e\u003e后背上熊毛的枝干已经连绵成片了。大概……要不了明天早上，你就会完全变成一头熊吧？\n\u003e\u003e你陷入回忆。\n\u003e\u003e-\u003e幻觉\n@else\n\u003e你看着那面镜子，看到自己，看到一个熊头人身的怪物。\n\u003e你开始怀疑吃下那些东西后的画面并不是你的幻觉。一个人，一个伪装成人的怪物，一段栖居在你身体里的念头，一柄永远留在你前额叶上的冰锥。\n\u003e你发觉自己正在被两部分拉扯、分割、变形，最后在镜子的两端，拼凑出一只茫然的怪物。\n\u003e你感觉身上的力气已经完全被抽离，便颓然地靠着墙壁坐下，一点一点剥下身上的衣服——它们已经让你觉得无比束缚。\n\u003e——你陷入回忆。\n\u003e-\u003e幻觉\n===幻觉===\n\u003cpause\u003e\u003ccolor=royalblue\u003e\u003cfont=幼圆\u003e你总是在看着他，看着他递来苹果的手，看着他的嘴巴，看着他的眼睛，等到他把目光投向你，再装作完全没有任何感觉。你看见你应该称为母亲的人来到家里，说着一些你听不懂的天赋和什么的话。\u003c/color\u003e\n\u003cpause\u003e\u003ccolor=blue\u003e\u003cfont=幼圆\u003e一张粉色的票从母亲手中流到他掌心，汗浸透了车票上的油墨，你努力抽动鼻子去闻，仿佛要记住这柄分割你们脐带的匕首。他坐在餐桌那边和你一起吃那一碗白粥，而后叹了一口气，那段只有你和他的日子就从这口气里流走。那年你6岁，他15岁，你们一同经历离开母体后的第一个离别。\u003c/color\u003e\n\u003cpause\u003e\u003ccolor=#0000CD\u003e\u003cfont=幼圆\u003e窗外树木轰隆隆向后行驶，你踏进洪水般的21世纪。那年你10岁，他19岁，你的行李里只有下火车之后够吃一天的口粮。哥，你叫了一声，变声期的嗓子像没对准频道的收音机。他已经变了许多，而你更是完全不像一个蚕豆的样子，以至于他愣了足足三秒钟才叫出你的名字。人潮从你的左手边涌来，而他握紧你的右手，直到有人亲昵地挽上他的另一侧胳膊。你弟弟？那人说，没听你说过啊，和你长得也不怎么像。\u003c/color\u003e\n\u003cpause\u003e\u003ccolor=#000080\u003e\u003cfont=幼圆\u003e那当然，我又不是他的儿子！你恼怒你愤怒你无理取闹，然后你说，那肯定，我只是管他叫哥，又不是管他叫爸。其余人笑得像打雷一样，他像小时候一样捏你的后脖颈，然后又看着你笑。你记得他笑起来嘴角两边有颊廊，小小的，你依靠血缘、爱意和颊廊认出他，而后匆匆十一年。\u003c/color\u003e\n\u003ccolor=#4B0082\u003e\u003cfont=幼圆\u003e你说不清是自己陪着他更多一点还是他陪着你更多一点，或许两者皆是，或许你一厢情愿。你在无数个夜晚里勾住他的手指，像回到羊水里一般漂浮，血液就从你们相连的指尖里再次熔为一炉。别怕，哥保护你……他口齿不清地回应，像很久以前那样轻轻拍你的后背。\u003c/color\u003e\n\u003cpause\u003e\u003ccolor=#800080\u003e\u003cfont=幼圆\u003e你知道你不想和他分开，于是你笨拙地学习人类从没有弄清楚的爱。当你在那个夜晚里测量他手指又亲吻他嘴角的时候，那是你的本心吗？那是你的真情吗？你不知道，你只是无法失去他，于是开始仿效爱。\u003c/color\u003e\n\u003cpause\u003e\u003ccolor=#A52A2A\u003e\u003cfont=幼圆\u003e“你出去住吧。”\u003c/color\u003e\n\u003cpause\u003e\u003ccolor=#A52A2A\u003e\u003cfont=幼圆\u003e他在一个夏天里仿佛提起商店的汽水一样平淡，我给你找好房子了。你那会提起的那个同学叫什么？我觉得人还不错，你喜欢的话就谈。对了，我和**打算明年结婚……戒指还没买。来帮我参谋参谋吧，一个人确实处理不过来这些事情。\u003c/color\u003e\n\u003cpause\u003e\u003ccolor=red\u003e\u003cfont=幼圆\u003e——你无法确定，你也不想确定那件事他是否已经知情，因为答案是既定的；于是你重新看向他的眼睛。黄昏的微光映入他的眼中，仿佛海水中淘洗出最纯净的、最璀璨的黄金。\u003c/color\u003e\n\u003cpause\u003e\u003cbr\u003e\u003ccolor=#DC143C\u003e\u003csize=1.5\u003e\u003cfont=黑体\u003e\u003cb\u003e如 \u003cpause=200\u003e果 \u003cpause=200\u003e那 \u003cpause=200\u003e些 \u003cpause=200\u003e人 \u003cpause=200\u003e消 \u003cpause=200\u003e失 \u003cpause=200\u003e就 \u003cpause=200\u003e好 \u003cpause=200\u003e了\u003c/color\u003e\u003cbr\u003e\u003cbr\u003e\n-\u003e目击\n===目击===\n@if{mirrorbroke===1}\n\u003e\u003cpause\u003e窗外的云已经完全逼近你的身前。\n\u003e你听见最后一丝电流熄灭，那些长久盘桓在你眼前的监视器红点也已经消失。镜子已经碎了，你知道；你从此刻开始感到无与伦比的畅快，以至于你开始发自内心地大笑。\n\u003e你不在乎那些什么其他人，你不在乎那些事情，你不在乎那些严密的秩序和恪守的原则。你只知道你需要他，而他此刻就在这里。\n\u003e你站起身来。\n\u003e你打开房门，在十点的那一刻踏出房门。这里的一切在黑暗里悄然湮灭，只剩下你，和你永不熄灭的，金黄色的太阳。\n\u003e\u003ccolor=#DC143C\u003e\u003csize=1.5\u003e\u003cfont=黑体\u003e\u003cb\u003e其他的都已经不再重要。\u003c/color\u003e\n\u003e@img(\"assets/fzdidx.jpg\")\n\u003e@img(\"assets/mlidx.jpg\")\n\u003e【结局12】长存\n\u003e-\u003eEND\n@else\n\u003e*【第四天】\n\u003e-\u003e第四天\n===第四天===\n\u003csize=1.5\u003e\u003ccolor=aqua\u003e\u003cbr\u003e/  “人们总将长久地凝视自己无法拥有之物，称之为欲望，并为之痛苦，在梦境中追逐。如此，扭曲地度过自己的一生。”  /\u003c/size\u003e\u003cbr\u003e\u003cbr\u003e\n你睁开眼睛。这里的环境和你房间相似，但你知道这不是你的房间，因为你已经看到了兔子的尸体，以及你手边的刀。\n你对于怎么来到这里没有任何印象，但你知道，镜子里就是一直没有露面的第12人。你们、不，你的“\u003cb\u003e影子\u003c/b\u003e”……\n你站起身来，长久地注视着窗外，一片灰蒙蒙的、无法区分天空和土地界限的地方。\n你是否还想要离开这里？\n@if{clue===5}\n\u003e*[是]\n\u003e你回到房间清理身上的血迹。镜子——不，\u003cb\u003e那个人\u003c/b\u003e并没有出现在镜子里。镜中映出你卫生间里的一切，除了你自己；或许你很快就会彻底沦为一头熊。\n\u003e……我应该最后做点什么。\n\u003e-\u003e寻找线索\n@else\n\u003e*[否]\n-\u003e不想离开\n===不想离开===\n【走廊】\n周围都很安静。你路过每一扇门，正如你第一次进入这里一样。其他的、无关紧要的，正随着你的步伐而慢慢停摆。你第一次意识到这里如此安静，只有你们两个人的心跳。\n山羊的房间留着门，于是你走过去。\n*[敲门]\n他似乎并不意外，只是拍拍身边的位置，示意你走近。\n你坐在他身边。\n山羊只是望着窗外，没有再说话，直到第一滴雨落在窗棂上。\n你彻底迷失在梦境中。\n【结局6】停留\n-\u003eEND\n===寻找线索===\n+[贩卖机]-\u003e贩卖机\n*[山羊房间]-\u003e山羊房间\n===贩卖机===\n@if{clue===5}\n\u003e你还没有找到密码的线索。\n\u003e-\u003e寻找线索\n@else\n\u003e-\u003e最后\n===山羊房间===\n~clue++\n【山羊房间】\n他似乎并不意外你的到来，只是坐在那里抬头看了你一眼，就又把头转了回去。窗外的风穿过那棵树，慢慢落下一片枯黄的叶子。北极熊居然能看懂秋天，你有些自嘲地想，尽管你还勉强能说自己并不是一头完全的熊，因为脑子还有一些人类的意识，虽然长着厚厚的白色熊毛……\n\u003cpause\u003e\u003cb\u003e那么，为什么山羊除了头部以外，其他部分仍然保持着正常的人形？\u003c/b\u003e\n*[探查]\n你轻而易举地制服了他，拆下那片白色直接缝在他皮肤上的水洗唛，上面写着19881020。\n@img(\"assets/chaixiabiaoqian.jpg\")\n“跟我走。”你向他伸出手。\n-\u003e寻找线索\n===最后===\n你来到贩卖机前，用山羊的衣角做了验证。画面闪动一下，弹出那个熟悉的界面：\n\u003cpause\u003e\u003ccolor=red\u003e已验证身份信息\u003c/color\u003e\n\u003ccolor=red\u003e正在检测登录环境，请稍候……\u003c/color\u003e\n\u003ccolor=red\u003e【请输入锁定密码，以查看监控回放！】\u003c/color\u003e\n@input(lastin,\"锁定密码\")\n@if{lastin === suoding}\n\u003e-\u003e【一切的结局】\n@else\n\u003e\u003ccolor=#DC143C\u003e\u003csize=1.5\u003e\u003cfont=黑体\u003e\u003cb\u003e或 \u003cpause=200\u003e许 \u003cpause=200\u003e你 \u003cpause=200\u003e并 \u003cpause=200\u003e不 \u003cpause=200\u003e想 \u003cpause=200\u003e结 \u003cpause=200\u003e束 \u003cpause=200\u003e这 \u003cpause=200\u003e一 \u003cpause=200\u003e切 \u003cpause=200\u003e对 \u003cpause=200\u003e吗 \u003cpause=200\u003e？\u003c/color\u003e\n\u003e-\u003e是否回到循环\n===是否回到循环===\n*【是】\n\u003e贩卖机卡顿了一下，而后吐出一把手枪。\n\u003e*[上膛]\n\u003e\u003e你掏出那枚子弹。你意识到这或许不是第一次，也不会是最后一次。\n\u003e\u003e你扣动了扳机。\n\u003e\u003e【结局?】无尽\n\u003e\u003e-\u003e清空记忆\n===清空记忆===\n\u003cpause\u003e\u003ccolor=red\u003e为了保证您的游戏体验，现在执行【记忆清洗】功能。\u003c/color\u003e\n\u003ccolor=red\u003e请稍候……\u003c/color\u003e\n~ let knock = false\n~ let check_goats_label = false\n~ let label = 0\n~ let goats_red_apple = 0\n~ let being_beast = 0   \n~ let desire_to_eat = 0\n~ let clue = 0\n~ let shirt = false\n~ let day2nocan = 0\n~ let lionchocker = 0\n~ let day2givethecan = 0\n~ let knife = 0\n~ let xianyi = 0\n~ let heknowsthemirror =  0\n~ let goatsshirt = 0\n~ let truth = 0\n~ let notebook = 0\n~ let heavy = 0\n~ let mirrorbroke =0\n~ let cishu = 0\n~ let inputnum = 0\n~ let inputsuoding = 0\n~ let suodingcishu = 0\n~ let caidan = 0\n~ let lastin = 0\n\u003ccolor=red\u003e已 \u003cpause=300\u003e完 \u003cpause=300\u003e成 \u003cpause=300\u003e清 \u003cpause=300\u003e洗\u003c/color\u003e\n【结局？】无尽\n-\u003e第一天_醒来\n===【一切的结局】===\n\u003cpause\u003e你输入了正确的锁定密码，贩卖机发出刺耳的滋啦声。\n*[查看监控]\n【8.28】\n你把他铐在了床头。\n【8.30】\n他似乎明白挣扎并没有什么用，于是只长久地在床上坐着。\n【9.6】\n画面开始频繁变化。你仔细分辨了一下，白天基本上都是拍摄他一个人的画面，而晚上则会变为你印象中那些房间。你……不，“你”吃下的东西越多，呕吐越频繁。“你”开始无休止地做梦。\n【9.10】\n大厅里正播报着“游戏结束”，而你站在血泊中。山羊那双金黄色的眸子很快黯淡下去。你又重新回到了这里。\n【9.15】\n第二次循环结束。你看到自己的喉咙被项圈割断，这次大概是山羊的阵营胜利。你又重新回到了这里。\n\u003ccolor=royalblue\u003e回到这里。\u003c/color\u003e\n\u003ccolor=blue\u003e回到这里。\u003c/color\u003e\n\u003ccolor=#000080\u003e回到这里。\u003c/color\u003e\n……\n*[结束放映]\n-\u003e结束\n===结束===\n\u003cpause\u003e你知道自己应该无法离开这里了。无论是谁的死，无论重来多少次，都无法影响游戏真正的结局。\n你被长久地、永远地、无尽地困在了这里。\n“你……”\n山羊说话了。\n@if{heknowsthemirror===1}\n\u003e“你房间里不是有镜子吗？”\n\u003e镜子？\n\u003e你回头看了他一眼，刚才还混乱的思绪突然清晰起来。既然、既然镜子里的“你”可以在晚上通过镜子来到这里，那么你应该也确实可以通过镜子离开……\n\u003e-\u003e镜子\n@else\n\u003e“你还记得吗？小时候。”他笑了笑，“你一直说要永远和我在一起。”\n\u003e他朝你伸出手来。\n\u003e\u003ccolor=aqua\u003e\u003cb\u003e你不知道这样的永远是否也算永远，但此刻，你紧握住他的手。\u003c/color\u003e\n\u003e【结局7】永远\n===镜子===\n\u003cpause\u003e你来到镜子前。\n\u003cpause\u003e\u003cb\u003e恭喜你，■■■。你早该知道你没办法通过什么狗屁的做梦来逃避这一切。\u003c/b\u003e\n\u003ccolor=blue\u003e你想的那些事情，有些已经付诸实践，有些很快就会在你精神崩溃后变成现实，你比谁都更清楚。\u003c/color\u003e\n\u003ccolor=blue\u003e你没有面对的勇气。\u003c/color\u003e\n\u003ccolor=blue\u003e你一直都是那样一个胆小鬼。\u003c/color\u003e\n\u003cpause\u003e身后的一切轰然倒塌，山羊的面孔也渐渐消失不见。\n你穿过那面镜子，和你房间完全镜像的世界里，山羊，不，他坐在床边，手铐将他长久地留在了这里。今天是他的生日，你想，我应该告诉他生日快乐。\n你手中紧握着那串钥匙。\n*[解开手铐]\n\u003e你解开了他的手铐。\n\u003e-\u003e结局8\n*[扔掉钥匙]\n他并没有对你说什么。\n你知道他一向对你并不严苛，即便是做出那样的事情，他依旧没有说什么。\n你知道是自己搞砸了一切，但你并不是唯一要对此负责的人。\n\u003ccolor=red\u003e\u003csize=1.2\u003e\u003cb\u003e\u003cfont=黑体\u003e——把他吃下去吧。\u003c/color\u003e\n【结局9】眼泪\n-\u003eEND\n===结局8===\n*[哥哥]\n他并没有对你说什么。你知道他一向对你并不严苛，即便是做出那样的事情，他依旧没有说什么。你知道是自己搞砸了一切，也知道自己应该为此负责。\n“对不起，哥。”你站在他面前，“祝你生日快乐，还有……”\n你从口袋里掏出那枚子弹。\n你看到它闪着淡淡的火彩，那是你想给他的，也是他三十年来对你唯一一次的索求。\n“祝你幸福，永远。”\n【结局8】哥哥\n-\u003eEND"},"assetBase":"","css":"","characters":""};</script>
